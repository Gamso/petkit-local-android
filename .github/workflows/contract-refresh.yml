# Keeps api/openapi.yaml, the server contract the app's (and the mock server's) contract tests
# read, in step with petkit-local's latest release (docs/ARCHITECTURE.md §7, issue 8).
#
# Weekly and on demand: fetch the document at the latest release tag (or the ref given), and if
# it changed, push a branch and open a pull request, so the change is reviewed and tested like
# any other.
#
# Repository settings this needs:
# - Settings > Actions > General > Workflow permissions: "Allow GitHub Actions to create and
#   approve pull requests", or `gh pr create` is refused.
# - Optional secret CONTRACT_REFRESH_TOKEN (a fine-grained token with contents and pull-requests
#   write on this repository). Pull requests opened with the default GITHUB_TOKEN do not start
#   other workflows, so without it ci.yml does not run on the PR until someone pushes to it or
#   closes and reopens it; this workflow therefore runs the contract tests itself and writes the
#   result into the PR.
name: contract-refresh

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "petkit-local tag, branch or commit (empty: the latest release)"
        required: false
        default: ""

concurrency:
  group: contract-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.CONTRACT_REFRESH_TOKEN || github.token }}
      INPUT_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CONTRACT_REFRESH_TOKEN || github.token }}

      - name: Pick the server ref
        id: ref
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            if ! ref="$(gh release view --repo Gamso/petkit-local --json tagName --jq .tagName)"; then
              echo "::notice::petkit-local has no release yet; nothing to refresh."
              exit 0
            fi
          fi
          case "$ref" in
            *[!A-Za-z0-9._/-]*|"") echo "::error::Unusable ref '$ref'"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "branch=contract-refresh/$(printf '%s' "$ref" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Fetch the document
        id: fetch
        if: steps.ref.outputs.ref != ''
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          ./scripts/update-openapi.sh "$REF"
          # The document itself; a new ref with identical content is not worth a PR.
          if git diff --quiet -- api/openapi.yaml; then
            echo "api/openapi.yaml is already at $REF's content."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a pull request for this ref is already open
        id: open
        if: steps.fetch.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.ref.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists; its pull request is the one to review."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.fetch.outputs.changed == 'true' && steps.open.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.fetch.outputs.changed == 'true' && steps.open.outputs.exists == 'false'
        with:
          cache-read-only: true

      # The result goes into the pull request: a failing contract is exactly what it is for.
      - name: Run the contract tests against the new document
        id: tests
        if: steps.fetch.outputs.changed == 'true' && steps.open.outputs.exists == 'false'
        run: |
          app=passed
          ./gradlew :core:network:testDebugUnitTest -Ppetkit.testEngines=junit-jupiter || app=failed
          mock=absent
          if [ -x mock-server/gradlew ]; then
            mock=passed
            (cd mock-server && ./gradlew test) || mock=failed
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "mock=$mock" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.fetch.outputs.changed == 'true' && steps.open.outputs.exists == 'false'
        env:
          REF: ${{ steps.ref.outputs.ref }}
          BRANCH: ${{ steps.ref.outputs.branch }}
          APP: ${{ steps.tests.outputs.app }}
          MOCK: ${{ steps.tests.outputs.mock }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add api/
          git commit -m "Refresh the server contract to petkit-local $REF" \
            -m "api/openapi.yaml fetched by the contract-refresh workflow."
          git push origin "$BRANCH"
          {
            echo "petkit-local's \`openapi.yaml\` at \`$REF\` differs from the vendored copy."
            echo
            echo "Contract tests run by the refresh workflow:"
            echo "- app (\`:core:network\`): **$APP**"
            echo "- mock server: **$MOCK**"
            echo
            echo "A failure here is the point of this pull request: update the DTOs, the routes"
            echo "or the mock server until the tests pass, on this branch."
          } > body.md
          gh pr create --base main --head "$BRANCH" \
            --title "Refresh the server contract to petkit-local $REF" --body-file body.md
