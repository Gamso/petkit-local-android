# Weekly update pull requests. Each one runs the full CI (static, unit, compose, build, e2e,
# smoke) before it can be merged, so an upgrade that breaks the app is caught in its own PR.
# Nothing here is scanned until the files it watches exist; the Gradle project and the e2e
# compose file arrive with milestone M0 (docs/ROADMAP.md).
version: 2
updates:
  # Libraries and plugins, from the version catalog (gradle/libs.versions.toml).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # AndroidX and Compose move together; one PR is easier to test than ten.
      androidx:
        patterns: ["androidx.*", "com.google.android.material*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.google.devtools.ksp*"]
      test:
        patterns: ["junit*", "org.junit*", "io.mockk*", "app.cash.turbine*", "org.robolectric*", "io.github.takahirom.roborazzi*"]

  # The mock server is a separate Gradle build with its own catalog
  # (mock-server/gradle/libs.versions.toml); its tests run in mock-server.yml.
  - package-ecosystem: gradle
    directory: /mock-server
    schedule:
      interval: weekly
    groups:
      mock-server:
        patterns: ["*"]

  # The mock server image's base images, pinned by digest in mock-server/Dockerfile.
  # Patch and digest updates only: the Java major version is the build's toolchain
  # (jvmToolchain in mock-server/build.gradle.kts, setup-java in the workflows) and the app's,
  # so moving to the next LTS is a deliberate change made everywhere at once.
  - package-ecosystem: docker
    directory: /mock-server
    schedule:
      interval: weekly
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  # Workflow actions, pinned by SHA in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Not the petkit-local server image of e2e/docker-compose.yml: the nightly run against the real
  # server (e2e-real-server.yml) takes its floating `dev` tag on purpose, to catch drift with the
  # server as it is now, so there is no pin to raise.
