openapi: 3.1.0
info:
  title: petkit-local app API
  version: "1"
  summary: API for the petkit-local phone app.
  description: |
    Served by petkit-local on its own port (8097 by default), and on nothing else:
    neither the web panel nor the device API is reachable through it.

    Every route answers 401 `password_not_set` until a password has been set in the
    petkit-local panel (Setup -> Phone app access). After that, `/info` and this file
    are public, `/auth/login` takes the password, and every other route needs
    `Authorization: Bearer <token>` with a token from `/auth/login`.

    A token lasts until logout, revocation from the panel, a password change, or 90
    days without use (each authenticated request extends it).

    Conventions: times are Unix epoch seconds (`null` when unknown), weights are grams,
    durations are seconds. Media URLs are absolute paths on this API, to be joined to
    the base URL the app reached the server at; fetch them with the same bearer header.
    Every refusal is an `Error` object.

    Writes go to the device the way Home Assistant's do: published at once when it
    holds an MQTT session, otherwise queued for its next HTTP poll. Each answers
    `delivered`: `mqtt`, `queued`, or `local` when only petkit-local's own state
    changed. A device confirms a write in its next report, which `/ws` relays.

    Bluetooth accessories (W5/W4/CTW2/CTW3 fountains, the K3 Pura Air) are devices
    here too, under their own id, as in Home Assistant: `connection` is `ble`,
    `parent_id` names the device relaying them, and that device lists them in
    `accessories`. They have entities and actions, never a schedule or live video.

    Adding a field to a response is a compatible change; removing or renaming one
    is not and requires `/app/v2`.
servers:
  - url: /app/v1
security:
  - bearer: []
tags:
  - name: meta
  - name: auth
  - name: devices
  - name: updates
  - name: video
  - name: timeline
  - name: media
  - name: pets
  - name: controls
  - name: feeding
  - name: push
  - name: notifications

paths:
  /info:
    get:
      tags: [meta]
      operationId: getInfo
      summary: Server identity and clock. Public once a password is set.
      description: |
        A valid bearer token is optional here; with one, `server_version` and
        `session` are filled in, so the app can check its token in the same call.
      security:
        - {}
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "401": { $ref: "#/components/responses/PasswordNotSet" }

  /openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenApi
      summary: This document. Public once a password is set.
      security:
        - {}
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/PasswordNotSet" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange the password for a per-phone session token.
      description: |
        Failed attempts are counted per client address. Each one locks that address
        out for twice as long as the last (1 s, 2 s, 4 s ... up to 15 minutes); a
        locked-out attempt is answered 429 without the password being checked.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. The token is shown only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`password_not_set`, or `invalid_password` (with `Retry-After`)."
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the calling session (only that one).
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the password. Needs the current one; revokes every OTHER session.
      description: |
        The calling session stays signed in. The current password is checked under
        the same per-address lockout as login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePasswordResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "No valid session, or `invalid_password` for the current password."
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Every device, Bluetooth accessories included, ordered by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /devices/{id}:
    get:
      tags: [devices]
      operationId: getDevice
      summary: One device with the current value of each of its entities.
      description: |
        A Bluetooth accessory answers here as well. A K3's entities are its
        `k3_liquid` (the cartridge level, %) and `k3_battery`; it has no actions. A
        fountain's are its pump, filter and settings, as Home Assistant shows them.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  device: { $ref: "#/components/schemas/DeviceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{id}/actions/{action}:
    post:
      tags: [controls]
      operationId: runDeviceAction
      summary: Press one of the device's buttons (feed, clean, deodorize, ...).
      description: |
        Only the actions in the device's `actions` list (the buttons Home Assistant
        shows for that model). One marked `destructive` cannot be undone — it spends a
        consumable or takes the device out of service — and is refused with 422
        `confirmation_required` unless the body is `{"confirm": true}`. Any other
        action needs no body.

        On a Bluetooth accessory the press is relayed by its parent, which can only
        do so while it holds an MQTT session: it is sent at once (`delivered` is
        `mqtt`) or refused with 409 `accessory_unreachable`, never queued.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: action
          in: path
          required: true
          description: An action `key` from `DeviceDetail.actions`.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: Sent or queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AccessoryUnreachable" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /devices/{id}/entities/{key}:
    put:
      tags: [controls]
      operationId: setDeviceEntity
      summary: Change a setting — an entity whose `settable` is true.
      description: |
        `value` is typed by the entity's `component`: a boolean for `switch`, a
        number within `min`/`max` for `number`, one of `options` for `select`,
        `HH:MM` or `HH:MM:SS` for `time`, a string of at most 255 characters for
        `text`. The answer carries the entity with the value now stored; the
        device's next report confirms or overwrites it. A Bluetooth accessory's
        setting is relayed by its parent, as an action is: sent now, or 409.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: key
          in: path
          required: true
          description: An entity `key` from `DeviceDetail.entities`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntityWriteRequest" }
      responses:
        "200":
          description: Stored, and sent or queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityWriteResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AccessoryUnreachable" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /devices/{id}/schedule:
    get:
      tags: [feeding]
      operationId: getFeedingPlan
      summary: A feeder's recurring meals and whether they are paused.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties:
                  schedule: { $ref: "#/components/schemas/FeedingPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotAFeeder" }
    put:
      tags: [feeding]
      operationId: setFeedingPlan
      summary: Replace the meals, pause or resume them — or both, pushed once.
      description: |
        `groups` replaces every recurring meal (pending one-off feeds are kept);
        `active` false pauses the plan: the meals stay stored and the feeder is
        told it has none until it is resumed. Send either or both.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedingPlanWrite" }
      responses:
        "200":
          description: Stored, and sent or queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedingPlanResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotAFeeder" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /devices/{id}/deferred-feeds:
    get:
      tags: [feeding]
      operationId: listDeferredFeeds
      summary: A feeder's pending one-off feeds, soonest first.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deferred_feeds]
                properties:
                  deferred_feeds:
                    type: array
                    items: { $ref: "#/components/schemas/DeferredFeed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotAFeeder" }
    post:
      tags: [feeding]
      operationId: addDeferredFeed
      summary: Schedule one feed at a date and time (the feeder's own timezone).
      description: A pause of the recurring plan does not hold a one-off feed back.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeferredFeedRequest" }
      responses:
        "201":
          description: Stored, and sent or queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeferredFeedResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotAFeeder" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /devices/{id}/deferred-feeds/{feed_id}:
    delete:
      tags: [feeding]
      operationId: deleteDeferredFeed
      summary: Cancel one pending one-off feed.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: feed_id
          in: path
          required: true
          description: A `DeferredFeed.id`.
          schema: { type: string }
      responses:
        "200":
          description: Removed, and the feeder told.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`device_not_found`, `not_a_feeder`, or `feed_not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /devices/{id}/live:
    get:
      tags: [video]
      operationId: openLiveVideo
      summary: The camera's live video as fragmented MP4 over a WebSocket (go2rtc MSE).
      description: |
        A WebSocket upgrade, authenticated by the same `Authorization: Bearer` header as
        every route (sent on the upgrade request). Every refusal happens before the
        upgrade, as a normal JSON `Error`. The stream is always this device's own:
        nothing the client sends names it.

        Message flow:

        1. Client -> server, text, once: `{"type":"mse","value":"<codecs>"}` — the codec
           list the player supports, comma-separated MSE strings, e.g.
           `avc1.640029,avc1.64002A,avc1.640033,hvc1.1.6.L153.B0,mp4a.40.2,mp4a.40.5,opus`.
           Only `type` and `value` are used; any other message, or a second request, is
           answered with an `error` message and not acted on. Binary messages from the
           client are ignored.
        2. Server -> client, text: `{"type":"mse","value":"video/mp4; codecs=\"avc1.42001F,mp4a.40.2\""}`
           — the MIME type to create the `SourceBuffer` with.
        3. Server -> client, binary, continuous: the first message is the init segment
           (`ftyp`+`moov`), every following one a media fragment (`moof`+`mdat`). Append
           them in order. A viewer joining a running stream gets the init segment at
           once and its first fragment at the next keyframe.
        4. Server -> client, text, at any time: `{"type":"error","value":"<text>"}` — the
           camera stream could not be opened (a camera takes a new viewer only some
           seconds after the last one left) or a client message was refused. The socket
           stays open; close it and retry after a few seconds.

        Close codes: `1000` closed by the client; `1001` the server is stopping;
        `1011` the stream ended (camera or go2rtc went away) — retry after a few
        seconds; `1013` the client did not keep up with the stream (more than 4 MiB
        queued) — fall back to HLS; `4401` the session ended (logout, revocation,
        password change) — sign in again; `4409` the same session opened this
        camera again, which replaces the older view.

        Viewers are capped at 2 per camera and 4 in total, WebSocket and HLS together;
        one session holds at most one view per camera. The server pings every 20 s.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "101":
          description: Switching protocols; the WebSocket follows the flow above.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`device_not_found`, or `stream_not_found`: not a camera, the camera
            patch is not applied, or the camera's stream is not reachable."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426":
          description: "`upgrade_required`: the request was not a WebSocket upgrade."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/VideoLimitReached" }
        "503": { $ref: "#/components/responses/VideoUnavailable" }

  /devices/{id}/live/hls/{file}:
    get:
      tags: [video]
      operationId: getLiveHls
      summary: The camera's live video as HLS (fMP4 segments), the fallback to the WebSocket.
      description: |
        Start with `playlist.m3u8` WITHOUT `id`: it opens an HLS session (one viewer
        slot, capped like the WebSocket) and answers a master playlist whose one
        variant is `playlist.m3u8?id=<session>`. Every URI in every playlist is
        RELATIVE to this route, so a player resolves them here; send the same bearer
        header on each request (Media3: `DefaultHttpDataSource.Factory`
        `.setDefaultRequestProperties`).

        A session id works only for the session that opened it and this device. It
        lapses after ~5 s without a request (go2rtc's own limit), which a playing
        player never reaches; after that its files answer 404 `hls_session_expired`
        and the player should start again from `playlist.m3u8` without `id`.
        Segments are about 0.5 s; expect a few seconds of delay.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum: [playlist.m3u8, init.mp4, segment.m4s]
        - name: id
          in: query
          description: The HLS session, as written in the playlists. Absent only on the
            first `playlist.m3u8`.
          schema: { type: string }
        - name: "n"
          in: query
          description: The segment number (`segment.m4s` only), as written in the playlist.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The playlist, init segment or media segment.
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/iso.segment:
              schema: { type: string, contentMediaType: video/iso.segment }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`device_not_found`, `stream_not_found`, `hls_session_not_found`
            (an id this session did not open for this device), `hls_session_expired`, or
            `not_found` (another file)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/VideoLimitReached" }
        "502":
          description: "`bad_upstream`: go2rtc answered something this route will not
            relay (refused rather than passed through)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/VideoUnavailable" }

  /timeline:
    get:
      tags: [timeline]
      operationId: getTimeline
      summary: History as grouped cards, newest first, cursor-paginated.
      parameters:
        - name: device
          in: query
          description: Only this device.
          schema: { type: integer }
        - name: day
          in: query
          description: Only this local calendar day (cut at the server's local midnight).
          schema: { type: string, format: date }
        - name: kind
          in: query
          description: Only cards under this filter chip.
          schema:
            type: string
            enum: [all, pet, toileting, drinking, feeding, cleaning, health_alert, fault]
            default: all
        - name: pet
          in: query
          description: Only cards attributed to this pet.
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page, verbatim. Opaque.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelinePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /timeline/{event_id}:
    get:
      tags: [timeline]
      operationId: getTimelineEvent
      summary: One stored event, with its decoded fields and its media.
      parameters:
        - name: event_id
          in: path
          required: true
          description: A timeline item's `id`, or one of its steps' `id`.
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event: { $ref: "#/components/schemas/EventDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /media/thumb/{path}:
    get:
      tags: [media]
      operationId: getMediaThumbnail
      summary: A JPEG thumbnail for a photo or video in the media tree.
      parameters:
        - { $ref: "#/components/parameters/MediaPath" }
      responses:
        "200":
          description: The thumbnail.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/{path}:
    get:
      tags: [media]
      operationId: getMediaFile
      summary: One photo or video from the media tree. Supports Range.
      parameters:
        - { $ref: "#/components/parameters/MediaPath" }
      responses:
        "200":
          description: The file.
          content:
            "*/*":
              schema: { type: string }
        "206":
          description: The requested range of the file.
          content:
            "*/*":
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: Every pet, ordered by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pets]
                properties:
                  pets:
                    type: array
                    items: { $ref: "#/components/schemas/Pet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /pets/{id}:
    get:
      tags: [pets]
      operationId: getPet
      summary: One pet, its weight and visit statistics, and its recent visits.
      parameters:
        - { $ref: "#/components/parameters/PetId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pet]
                properties:
                  pet: { $ref: "#/components/schemas/PetDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /pets/{id}/photo:
    get:
      tags: [pets]
      operationId: getPetPhoto
      summary: The pet's first reference photo.
      parameters:
        - { $ref: "#/components/parameters/PetId" }
      responses:
        "200":
          description: The photo.
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /ws:
    get:
      tags: [updates]
      operationId: openLiveUpdates
      summary: Live updates over a WebSocket.
      description: |
        Upgrade with `Authorization: Bearer <token>` on the request (a native client
        can send headers on the upgrade). Every frame the server sends is one JSON
        text message, an `UpdateMessage` told apart by `type`:

        * `hello` — first, once: every device as `DeviceDetail`, Bluetooth
          accessories included. Start from it rather than from an earlier `GET`, so
          nothing falls between the two.
        * `state` — a device's entities whose value changed, and only those. A device
          is looked at at most once a second, so a burst of reports is one message.
        * `device` — a device's summary when anything other than `last_seen` changed
          (online or offline, transport, firmware, an accessory linked or unlinked),
          or when a new device appears (fetch `/devices/{id}` for its entities).
        * `device_removed`.
        * `timeline` — a timeline card that is new or changed (its photos or video
          arrived, a cleaning attached). Replace any card with the same `id`, and
          drop those listed in `replaces`: an episode still in progress is keyed on
          its newest report until the one that closes it arrives. For history,
          open the socket first, then `GET /timeline`, and merge by `id`.

        The server pings every 25 s at the protocol level. The app may send
        `{"type": "ping"}` for an application-level `{"type": "pong"}`; anything else
        it sends is ignored.

        Close codes (the same as the live-video socket's): `1001` server shutting
        down; `4401` the session ended (logout, revoked in the panel, password
        changed or removed) — sign in again; `1013` the app read too slowly and its
        queue filled — reconnect, which starts from a fresh `hello`.
      responses:
        "101":
          description: Switching to the WebSocket protocol; each message is an `UpdateMessage`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateMessage" }
        "400":
          description: Not a WebSocket upgrade request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /push:
    put:
      tags: [push]
      operationId: registerPush
      summary: Register (or replace) this session's UnifiedPush endpoint.
      description: |
        One endpoint per session, stored with it: logout, revocation from the panel,
        a password change and 90 days without use remove it. Registering again
        replaces it.

        For every notification that passes the server's own gates (the per-kind
        switches set in the panel, one notification per event, a per-device rate
        limit), the server POSTs a `PushMessage` to every registered endpoint whose
        session's `kinds` allow it: `Content-Type: application/json`, `TTL: 86400`, `Urgency:
        high` for faults, failed meals and offline devices (`normal` otherwise), no
        redirect followed, TLS verified, 10 s timeout. An endpoint that answers 404
        or 410 three times in a row is unregistered (`session.push` in `/info`
        becomes `null`: register again).

        The message carries stable keys only — no title, no text, no URL, no token —
        so the app writes the notification itself, in the phone's language. See
        `PushMessage`. The same message reaches the notification socket
        (`/notifications/ws`); a phone needs only one of the two.

        `kinds` are the session's, shared with the notification socket: sent here,
        they replace its choice exactly as `PUT /notifications` does; left out, they
        stay as they are (a new session starts with `null`, every kind).

        The endpoint must be `https://` (plain `http://` only for a private address
        or a local name such as `*.lan`), without credentials or a fragment, at most
        2048 characters; a query is allowed. It may not point at the server itself,
        loopback, or a link-local, multicast or reserved address. It is never sent
        back: answers carry its host only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRegistrationRequest" }
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [push]
                properties:
                  push: { $ref: "#/components/schemas/PushRegistration" }
        "400":
          description: "`invalid_push_endpoint`, `bad_parameter` (kinds) or `bad_json`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
      callbacks:
        pushMessage:
          "{$request.body#/endpoint}":
            post:
              summary: One notification, POSTed by the server to the registered endpoint.
              requestBody:
                required: true
                content:
                  application/json:
                    schema: { $ref: "#/components/schemas/PushMessage" }
              responses:
                "2XX": { description: Accepted by the push server. }
                "404": { description: Gone; counted towards unregistering the endpoint. }
                "410": { description: Gone; counted towards unregistering the endpoint. }
    delete:
      tags: [push]
      operationId: unregisterPush
      summary: Stop pushing to this session. Succeeds when none is registered too.
      description: The session's `kinds` are kept; they also choose what its notification socket receives.
      responses:
        "200":
          description: Unregistered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: This session's notification kinds, and where its notification socket stands.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [notifications]
      operationId: setNotificationKinds
      summary: Choose the kinds this session receives, on every channel.
      description: |
        The kinds apply to the notification socket and to the session's UnifiedPush
        endpoint alike, and need no endpoint to be set. They narrow what the server
        sends, never widen it: a kind switched off in the panel (`server_kinds`) is
        sent to nobody. Stored with the session, so logout and the other ways a
        session ends forget them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationKindsRequest" }
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400":
          description: "`bad_parameter` (`kinds` missing, not a list or `null`, or longer than 32) or `bad_json`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /notifications/ws:
    get:
      tags: [notifications]
      operationId: openNotificationSocket
      summary: Notifications over a WebSocket, with catch-up — no ntfy needed.
      description: |
        A socket for the app to keep open in the background, as a push distributor
        would. It carries notifications only, never device state (that is `/ws`), so it
        is silent until something happens. Upgrade with `Authorization: Bearer <token>`
        on the request; a refusal (bad `after`, no session) happens before the upgrade,
        as a normal JSON `Error`.

        Every frame the server sends is one JSON text message, a `NotificationSocketMessage`
        told apart by `type`:

        * `hello` — first, once. `last_id` is the newest notification id the server has
          logged (whether or not it was for this phone); `replayed` how many
          `notification` messages with `replay: true` follow at once; `gap` whether
          notifications after `after` were dropped from the log before this phone came
          back for them (more than 500, or older than 3 days), so some are missing.
        * `notification` — one notification: a monotonic `id` and the same
          `PushMessage` a UnifiedPush endpoint would receive. `replay` is true for those
          sent because of `after`, false for live ones.
        * `pong` — the answer to a `{"type": "ping"}` the app sent; anything else it
          sends is ignored.

        Catch-up: pass `after`, the highest `id` received so far (or the hello's
        `last_id`, whichever is higher). The server first sends, oldest first, every
        logged notification after it that this session's kinds allow and that is not
        older than the session itself, then goes live; nothing falls between the two
        and nothing is sent twice. Leave `after` out on the very first connection, to
        start from now. An `after` above `last_id` comes from a log the server no
        longer has: everything it holds is replayed, with `gap: true`. The log holds the
        last 500 notifications of at most 3 days and survives a restart; ids are not
        reused unless the log file itself is lost, which the next `hello` reports as
        a `gap`.

        What is sent is what the ntfy topic and the UnifiedPush endpoints are sent: the
        server's per-kind switches, one notification per event and the per-device rate
        limit decide once for all three, then this session's `kinds`
        (`PUT /notifications`) choose among it. A session is owed catch-up from the
        first time it opens this socket until it ends.

        The server pings every 45 s at the protocol level (`heartbeat_sec`), inside
        Cloudflare's 100 s idle timeout. Treat two missed pings as a dead connection.

        Close codes (as `/ws` and live video): `1001` server shutting down — reconnect
        later; `4401` the session ended (logout, revoked in the panel, password changed
        or removed, 90 days unused) — sign in again, do not retry; `4409` this session
        opened another notification socket, which replaced this one — do not reconnect
        from the replaced one; `1013` the app read too slowly and its queue filled —
        reconnect with `after`, nothing is lost.
      parameters:
        - name: after
          in: query
          required: false
          description: The highest notification `id` already received; omit on the first connection.
          schema: { type: integer, minimum: 0, maximum: 999999999999999999 }
      responses:
        "101":
          description: Switching to the WebSocket protocol; each message is a `NotificationSocketMessage`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSocketMessage" }
        "400":
          description: "`bad_parameter` (`after` is not a non-negative integer), or not a WebSocket upgrade request."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A session token from `POST /auth/login`.

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PetId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    MediaPath:
      name: path
      in: path
      required: true
      description: A media-tree-relative path, as found in a `Media` object (slashes included).
      schema: { type: string }

  headers:
    RetryAfter:
      description: Seconds to wait before the next login attempt from this address.
      schema: { type: integer }

  responses:
    BadRequest:
      description: A malformed parameter or body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`password_not_set`, or `invalid_token` (missing, revoked or expired)."
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PasswordNotSet:
      description: "`password_not_set`: no password has been set in the panel yet."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource (a malformed id is not found either).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: The body was not sent as `application/json`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyAttempts:
      description: This address is locked out after wrong passwords.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccessoryUnreachable:
      description: |
        `accessory_unreachable`: a Bluetooth accessory is reached only through the
        device relaying it, while that device holds an MQTT session, and it does
        not now (or no registered device relays it). Nothing was sent or queued.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: |
        Understood and refused; nothing was changed. `error` says why:
        `confirmation_required`, `refused` (a value of the wrong type or out of
        bounds), `not_settable`, `invalid_schedule`, `invalid_feed`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotAFeeder:
      description: "`device_not_found`, or `not_a_feeder` for a device with no feeding plan."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The store behind this route is not running.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VideoLimitReached:
      description: "`live_limit_reached`: this camera (2) or the server (4) already has
        as many live viewers as it serves."
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VideoUnavailable:
      description: "`live_unavailable`: go2rtc, which serves the camera's stream, is not
        running or did not answer. Retry shortly."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code, e.g. `password_not_set`, `invalid_token`,
            `invalid_password`, `too_many_attempts`, `device_not_found`, `bad_cursor`.
        message: { type: string, description: Human-readable explanation. }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    Session:
      type: object
      required: [id, name, created, last_used, expires, kinds, push]
      properties:
        id: { type: string, description: "Public id; the panel revokes by it." }
        name: { type: string, description: The `device_name` given at login. }
        created: { type: number }
        last_used: { type: number, description: Updated at most every 5 minutes. }
        expires: { type: number, description: "`last_used` + 90 days." }
        kinds: { $ref: "#/components/schemas/NotificationKinds" }
        push:
          description: This session's push registration, `null` when there is none.
          oneOf:
            - { $ref: "#/components/schemas/PushRegistration" }
            - { type: "null" }

    PushRegistrationRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          maxLength: 2048
          description: The UnifiedPush endpoint the distributor gave the app.
        kinds:
          description: |
            The `PushMessage.kind`s this phone wants, on every channel (the session's
            kinds, as `PUT /notifications` sets them); `null` for every kind switched on
            in the panel; left out, the session's current choice is kept. Kinds this
            server does not know are ignored.
          oneOf:
            - type: array
              maxItems: 32
              items: { type: string }
            - { type: "null" }

    PushRegistration:
      type: object
      required: [host, kinds, registered]
      properties:
        host: { type: string, description: The endpoint's host. The endpoint itself is never returned. }
        kinds: { $ref: "#/components/schemas/NotificationKinds" }
        registered: { type: number }

    NotificationKind:
      type: string
      enum: [toilet, feed_served, feed_failed, error, food_low, consumable, offline]
      description: A notification kind; see `PushMessage.kind`.

    NotificationKinds:
      description: |
        The session's notification kinds (known ones, in the server's order), or `null`
        for every kind switched on in the panel. They apply to every channel.
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/NotificationKind" }
        - { type: "null" }

    NotificationKindsRequest:
      type: object
      required: [kinds]
      properties:
        kinds:
          description: |
            The kinds this phone wants, or `null` for every kind switched on in the panel;
            `[]` for none. Kinds this server does not know are ignored, so a newer app
            may name kinds an older server has not got.
          oneOf:
            - type: array
              maxItems: 32
              items: { type: string }
            - { type: "null" }

    NotificationSettings:
      type: object
      required: [kinds, server_kinds, connected, last_id]
      properties:
        kinds: { $ref: "#/components/schemas/NotificationKinds" }
        server_kinds:
          type: array
          description: |
            Every kind the server sends, in its order, and whether the panel's switch for
            it is on. A kind switched off there reaches no phone, whatever `kinds` says.
          items:
            type: object
            required: [kind, enabled]
            properties:
              kind: { $ref: "#/components/schemas/NotificationKind" }
              enabled: { type: boolean }
        connected: { type: boolean, description: Whether this session holds the notification socket now. }
        last_id:
          type: integer
          minimum: 0
          description: The newest notification id logged for catch-up; 0 before the first.

    NotificationSocketMessage:
      description: One WebSocket message from `/notifications/ws`, told apart by `type`.
      oneOf:
        - { $ref: "#/components/schemas/NotificationHello" }
        - { $ref: "#/components/schemas/NotificationDelivery" }
        - { $ref: "#/components/schemas/NotificationPong" }
      discriminator:
        propertyName: type
        mapping:
          hello: "#/components/schemas/NotificationHello"
          notification: "#/components/schemas/NotificationDelivery"
          pong: "#/components/schemas/NotificationPong"

    NotificationHello:
      type: object
      required: [type, server_time, heartbeat_sec, last_id, replayed, gap]
      additionalProperties: false
      properties:
        type: { type: string, const: hello }
        server_time: { type: number }
        heartbeat_sec: { type: number, description: The protocol ping interval (45). }
        last_id:
          type: integer
          minimum: 0
          description: The newest notification id logged, whoever it was for; 0 before the first.
        replayed:
          type: integer
          minimum: 0
          description: How many `notification` messages with `replay` true follow at once.
        gap:
          type: boolean
          description: |
            Notifications after `after` were dropped from the log (its 500-entry or
            3-day bound) or the log was lost: some this phone should have had are missing.

    NotificationDelivery:
      type: object
      required: [type, id, replay, message]
      additionalProperties: false
      properties:
        type: { type: string, const: notification }
        id:
          type: integer
          minimum: 1
          description: Monotonic. Pass the highest one received as `after` on reconnection.
        replay: { type: boolean, description: "True when sent as catch-up, false when live." }
        message: { $ref: "#/components/schemas/PushMessage" }

    NotificationPong:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, const: pong }

    PushMessage:
      type: object
      description: |
        The body the server POSTs to a registered endpoint (see `PUT /push`), and the
        `message` of a `notification` on the notification socket (`/notifications/ws`);
        compact JSON, a few hundred bytes at most. Stable keys only: build the notification
        text from them. A new key may be added within `v` 1; ignore keys you do not
        know. Nothing in it is secret.
      required: [v, kind, device_id, pet_id, code, ts]
      additionalProperties: false
      properties:
        v: { type: integer, const: 1 }
        kind:
          type: string
          enum: [toilet, feed_served, feed_failed, error, food_low, consumable, offline]
          description: |
            `toilet` a litter-box visit; `feed_served` a meal dispensed (or skipped
            because the bowl was not empty); `feed_failed` a meal that failed;
            `error` a device fault; `food_low` a hopper empty; `consumable` a bin,
            tray, filter, litter, water or deodorizer to see to; `offline` the device
            stopped answering.
        device_id: { type: [integer, "null"], description: "The device's `id`, as in `/devices`." }
        pet_id:
          type: [integer, "null"]
          description: "The pet's `id`, as in `/pets`, when the event was attributed to one."
        code:
          type: [string, "null"]
          maxLength: 64
          description: |
            What precisely happened, to be read with the device's `type`. For an event
            (`toilet`, `feed_served`, `feed_failed`, `error`): the device's event code,
            e.g. `"10"` for a litter-box visit — codes are per device category, so the
            same code means different things on a litter box and a feeder. For a state
            condition: the state key that triggered it — `foodLow`, `food1`, `food2`
            (`food_low`); `boxFull`, `sandPercent`, `deodorantLeftDays`,
            `sprayLeftDays`, `desiccantLeftDays`, `filterWarning`, `lackWarning`,
            `stgFullState`, `liquidLack` (`consumable`); `errorMsg` (`error`, the
            device's own fault text, which is not sent). `null` for `offline`.
        ts: { type: integer, description: When it happened (Unix epoch seconds). }

    Info:
      type: object
      required: [api_version, server_time, authenticated, server_version, session]
      properties:
        api_version: { type: integer, const: 1 }
        server_time: { type: number }
        authenticated: { type: boolean }
        server_version: { type: [string, "null"] }
        session:
          oneOf:
            - { $ref: "#/components/schemas/Session" }
            - { type: "null" }

    LoginRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
        device_name:
          type: string
          maxLength: 64
          description: Shown in the panel's list of signed-in phones.

    LoginResponse:
      type: object
      required: [token, token_type, idle_timeout_sec, session]
      properties:
        token: { type: string, description: "Send as `Authorization: Bearer <token>`." }
        token_type: { type: string, const: Bearer }
        idle_timeout_sec: { type: integer }
        session: { $ref: "#/components/schemas/Session" }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 1024 }

    ChangePasswordResponse:
      type: object
      required: [ok, revoked_sessions]
      properties:
        ok: { type: boolean, const: true }
        revoked_sessions: { type: integer }

    DeviceSummary:
      type: object
      required: [id, type, model, kind, online, transport, last_seen, firmware, is_camera,
                 connection, parent_id, accessories]
      properties:
        id: { type: integer }
        type: { type: string, description: "Codename, e.g. `t5`, `d4sh`, `w5`, `k3`." }
        model: { type: string, description: "Commercial name; `Unknown` for an unlisted codename." }
        kind:
          type: string
          enum: [litter_box, feeder, fountain, purifier, other]
        online:
          type: boolean
          description: For an accessory, whether the device relaying it is online.
        transport:
          type: string
          enum: [mqtt, http]
          description: For an accessory, its parent's (`http` when it has none).
        last_seen:
          type: [number, "null"]
          description: |
            Latest contact over either transport. For an accessory, when a frame from
            it last decoded; always null for a K3, whose readings ride on its parent's
            reports.
        firmware: { type: [string, "null"], description: Null for an accessory. }
        is_camera: { type: boolean }
        connection:
          type: string
          enum: [wifi, ble]
          description: |
            `ble` for an accessory with no network of its own, reached only through
            the device in `parent_id`.
        parent_id:
          type: [integer, "null"]
          description: |
            The device relaying this accessory; null for a WiFi device, and for an
            accessory linked to no registered device.
        accessories:
          type: array
          description: |
            The Bluetooth accessories this device relays; empty for an accessory. A
            litter box with a `purifier` here has a Pura Air (K3) linked. The firmware
            has one K3 slot, held by the first one listed.
          items: { $ref: "#/components/schemas/AccessoryRef" }

    AccessoryRef:
      type: object
      required: [id, type, kind]
      properties:
        id: { type: integer, description: "Its own id: `GET /devices/{id}` for its values." }
        type: { type: string, description: "Codename: `w5`, `w4`, `ctw2`, `ctw3` or `k3`." }
        kind:
          type: string
          enum: [fountain, purifier, other]

    DeviceDetail:
      allOf:
        - { $ref: "#/components/schemas/DeviceSummary" }
        - type: object
          required: [serial, entities, actions]
          properties:
            serial: { type: [string, "null"] }
            entities:
              type: array
              items: { $ref: "#/components/schemas/Entity" }
            actions:
              type: array
              description: The buttons it offers, destructive ones last.
              items: { $ref: "#/components/schemas/Action" }

    Action:
      type: object
      required: [key, name, destructive]
      properties:
        key: { type: string, description: "Pass to `POST /devices/{id}/actions/{action}`." }
        name: { type: string }
        destructive:
          type: boolean
          description: "Cannot be undone; confirm with the user, then send `{\"confirm\": true}`."

    ActionRequest:
      type: object
      properties:
        confirm:
          type: boolean
          description: Required, and true, for a `destructive` action.

    Delivered:
      type: string
      enum: [mqtt, queued, local]
      description: |
        `mqtt`: published to the device now (for a Bluetooth accessory, to the
        device relaying it). `queued`: the device is not on MQTT and takes it on its
        next HTTP poll. `local`: only petkit-local's state changed.

    WriteResult:
      type: object
      required: [ok, delivered]
      properties:
        ok: { type: boolean, const: true }
        delivered: { $ref: "#/components/schemas/Delivered" }

    ActionResult:
      type: object
      required: [ok, action, delivered]
      properties:
        ok: { type: boolean, const: true }
        action: { type: string }
        delivered: { $ref: "#/components/schemas/Delivered" }

    EntityWriteRequest:
      type: object
      required: [value]
      properties:
        value:
          description: Typed by the entity's component (see the operation).

    EntityWriteResult:
      type: object
      required: [ok, delivered, entity]
      properties:
        ok: { type: boolean, const: true }
        delivered: { $ref: "#/components/schemas/Delivered" }
        entity: { $ref: "#/components/schemas/Entity" }

    EntityChange:
      type: object
      description: The changing part of an `Entity`, as a live `state` message carries it.
      required: [key, value, display]
      properties:
        key: { type: string }
        value:
          description: As `Entity.value`.
        display: { type: [string, "null"] }

    Entity:
      type: object
      description: |
        One value the device exposes, as Home Assistant shows it. `key` is stable
        (it is the Home Assistant entity key).
      required: [key, name, component, value, display, unit, device_class, category, options, settable,
                 min, max, step]
      properties:
        key: { type: string }
        name: { type: string }
        component:
          type: string
          enum: [sensor, binary_sensor, switch, number, select, text, time]
        value:
          description: Raw value; a boolean for `binary_sensor` and `switch`; null if unreported.
        display:
          type: [string, "null"]
          description: The option label for an enum value, when it has one.
        unit: { type: [string, "null"] }
        device_class: { type: [string, "null"] }
        category:
          type: [string, "null"]
          enum: [config, diagnostic, null]
        options:
          type: [array, "null"]
          items: { type: string }
          description: The labels a `select` offers.
        settable:
          type: boolean
          description: "Whether `PUT /devices/{id}/entities/{key}` accepts a value for it."
        min: { type: [number, "null"], description: "A `number`'s lower bound, if it has one." }
        max: { type: [number, "null"], description: "A `number`'s upper bound, if it has one." }
        step: { type: [number, "null"], description: "A `number`'s increment." }

    Meal:
      type: object
      required: [id, time, amount, amount1, amount2]
      properties:
        id: { type: string, description: "Keep it when re-sending a meal; a new one may leave it out." }
        time: { type: integer, minimum: 0, maximum: 86399, description: Seconds since local midnight. }
        amount:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: A single-hopper feeder's portion; null on a Dual-Hopper.
        amount1:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: A Dual-Hopper's first hopper; null on a single hopper.
        amount2:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: A Dual-Hopper's second hopper (default 0); null on a single hopper.

    FeedingGroup:
      type: object
      required: [days, meals]
      properties:
        days:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: The device's day numbers, which the panel shows as 1 = Sunday ... 7 = Saturday.
        meals:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/Meal" }

    FeedingPlan:
      type: object
      required: [device_id, active, dual_hopper, groups]
      properties:
        device_id: { type: integer }
        active: { type: boolean, description: "False while paused: the meals are kept, none is served." }
        dual_hopper: { type: boolean, description: "Meals use `amount1`/`amount2`, not `amount`." }
        groups:
          type: array
          items: { $ref: "#/components/schemas/FeedingGroup" }

    FeedingPlanWrite:
      type: object
      description: |
        Either field, or both. A meal sends `time` and `amount` (single hopper) or
        `amount1` and optionally `amount2` (Dual-Hopper, default 0), and its `id` when
        it is an existing meal. At most 7 groups of 24 meals.
      properties:
        active: { type: boolean }
        groups:
          type: array
          maxItems: 7
          items: { $ref: "#/components/schemas/FeedingGroup" }

    FeedingPlanResult:
      type: object
      required: [ok, delivered, schedule]
      properties:
        ok: { type: boolean, const: true }
        delivered: { $ref: "#/components/schemas/Delivered" }
        schedule: { $ref: "#/components/schemas/FeedingPlan" }

    DeferredFeed:
      type: object
      required: [id, fire_at, amount, amount1, amount2]
      properties:
        id: { type: string }
        fire_at: { type: [number, "null"] }
        amount: { type: [integer, "null"], description: Single hopper; null on a Dual-Hopper. }
        amount1: { type: [integer, "null"], description: Dual-Hopper; null on a single hopper. }
        amount2: { type: [integer, "null"], description: Dual-Hopper; null on a single hopper. }

    DeferredFeedRequest:
      type: object
      required: [date, time]
      description: "`amount` for a single-hopper feeder; `amount1`, `amount2` or both for a Dual-Hopper."
      properties:
        date: { type: string, format: date, description: In the feeder's timezone. }
        time: { type: string, pattern: "^[0-9]{1,2}:[0-9]{2}$", description: "HH:MM, in the feeder's timezone." }
        amount: { type: integer, minimum: 0, maximum: 255 }
        amount1: { type: integer, minimum: 0, maximum: 255, default: 0 }
        amount2: { type: integer, minimum: 0, maximum: 255, default: 0 }

    DeferredFeedResult:
      type: object
      required: [ok, delivered, feed]
      properties:
        ok: { type: boolean, const: true }
        delivered: { $ref: "#/components/schemas/Delivered" }
        feed: { $ref: "#/components/schemas/DeferredFeed" }

    Media:
      type: object
      description: An episode's photos and videos, as API paths.
      required: [thumbnail, snapshot, highlight, playback, timelapse, waste, health, video_pending]
      properties:
        thumbnail: { type: [string, "null"] }
        snapshot: { type: [string, "null"] }
        highlight: { type: [string, "null"], description: The short event clip. }
        playback: { type: [string, "null"], description: "The whole recording, once assembled." }
        timelapse: { type: [string, "null"] }
        waste:
          type: array
          items: { type: string }
        health:
          type: array
          items: { type: string }
        video_pending:
          type: boolean
          description: A recording is expected but still being assembled.

    PetRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: [string, "null"], description: Null when the pet has since been deleted. }

    TimelineStep:
      type: object
      required: [id, ts, label, detail]
      properties:
        id: { type: integer }
        ts: { type: [number, "null"] }
        label: { type: string }
        detail:
          type: boolean
          description: A low-level step the official app does not show.

    TimelineItem:
      type: object
      required: [id, kind, filters, device_id, device_type, ts, display_ts, event_type,
                 event_kind, label, pet, duration_sec, weight_g, served, facts, media, steps]
      properties:
        id: { type: integer, description: "Pass to `GET /timeline/{event_id}`." }
        kind: { type: string, description: "`visit`, `event`, or a grouped cycle kind." }
        filters:
          type: array
          items: { type: string }
          description: The filter chips this card falls under.
        device_id: { type: [integer, "null"] }
        device_type: { type: [string, "null"] }
        ts: { type: [number, "null"], description: "Sort key: when the closing report arrived." }
        display_ts: { type: [number, "null"], description: "What to show: e.g. when the pet entered." }
        event_type: { type: [string, "null"] }
        event_kind: { type: [string, "null"] }
        label: { type: [string, "null"], description: Null for a visit. }
        pet:
          oneOf:
            - { $ref: "#/components/schemas/PetRef" }
            - { type: "null" }
        duration_sec:
          type: [integer, "null"]
          minimum: 0
          description: |
            How long the episode lasted, in whole seconds. Set on three kinds of card:
            a toilet visit (`visit`), a drink (`event_kind` `drinking`, closed by a
            fountain's drinking-done report) and a meal eaten at a camera feeder
            (`event_kind` `feeding`, closed by an eating-done report). A drink or a meal
            eaten is measured from the device's own start and end when its closing
            report carries both; otherwise from its start report to its end report;
            otherwise from the start the closing report states to when it arrived,
            which adds a few seconds of report latency. Null when the start is not
            known at all, on a card whose end never arrived, and on every other card,
            a dispensed feed included. Never estimated.
        weight_g: { type: [integer, "null"] }
        served:
          description: |
            What a dispensed feed put out, on a card closed by a finished feed. Null on
            every other card (a cat eating at a camera feeder included) and on a feed
            whose report states no amount, which is not the same as a meal that served
            nothing: that one is 0.
          oneOf:
            - { $ref: "#/components/schemas/ServedAmounts" }
            - { type: "null" }
        facts:
          type: array
          items: { type: string }
        media:
          oneOf:
            - { $ref: "#/components/schemas/Media" }
            - { type: "null" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/TimelineStep" }

    ServedAmounts:
      type: object
      required: [total, hopper1, hopper2]
      description: |
        A finished feed's output as the feeder reported it. Units follow the model, as
        a Meal's do: portions on a Dual-Hopper (`amount1`/`amount2`), the device's own
        unit on a single hopper (`amount`).
      properties:
        total:
          type: integer
          minimum: 0
          description: Everything the meal put out; 0 when nothing came out.
        hopper1:
          type: [integer, "null"]
          minimum: 0
          description: A Dual-Hopper's first hopper; null on a single hopper, or when the report left it out.
        hopper2:
          type: [integer, "null"]
          minimum: 0
          description: A Dual-Hopper's second hopper; null on a single hopper, or when the report left it out.

    TimelinePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    EventField:
      type: object
      required: [key, label, text]
      properties:
        key: { type: string }
        label: { type: string }
        text: { type: string }

    EventDetail:
      type: object
      required: [id, device_id, device_type, ts, event_type, event_kind, label, pet, facts,
                 fields, media]
      properties:
        id: { type: integer }
        device_id: { type: [integer, "null"] }
        device_type: { type: [string, "null"] }
        ts: { type: [number, "null"] }
        event_type: { type: [string, "null"] }
        event_kind: { type: [string, "null"] }
        label: { type: string }
        pet:
          oneOf:
            - { $ref: "#/components/schemas/PetRef" }
            - { type: "null" }
        facts:
          type: array
          items: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/EventField" }
        media:
          oneOf:
            - { $ref: "#/components/schemas/Media" }
            - { type: "null" }

    Pet:
      type: object
      required: [id, name, device_ids, entered_weight_g, weight_g, weight_learned, photo]
      properties:
        id: { type: integer }
        name: { type: string }
        device_ids:
          type: array
          items: { type: integer }
        entered_weight_g: { type: [number, "null"], description: The weight the owner typed. }
        weight_g:
          type: [number, "null"]
          description: What a visit is compared with — the learned weight once trusted.
        weight_learned: { type: boolean }
        photo: { type: [string, "null"], description: "`/app/v1/pets/{id}/photo`, if there is one." }

    PetStats:
      type: object
      required: [median_weight_g, visits_today, last_visit_ts, last_visit_weight_g,
                 last_visit_duration_sec, last_device_id]
      properties:
        median_weight_g: { type: [number, "null"] }
        visits_today: { type: integer }
        last_visit_ts: { type: [number, "null"] }
        last_visit_weight_g: { type: [number, "null"] }
        last_visit_duration_sec: { type: [number, "null"] }
        last_device_id: { type: [integer, "null"] }

    PetDetail:
      allOf:
        - { $ref: "#/components/schemas/Pet" }
        - type: object
          required: [stats, recent_visits]
          properties:
            stats: { $ref: "#/components/schemas/PetStats" }
            recent_visits:
              type: array
              description: Up to 20 visits from the last 7 days, newest first.
              items: { $ref: "#/components/schemas/TimelineItem" }

    UpdateMessage:
      description: One WebSocket message from `/ws`, told apart by `type`.
      oneOf:
        - { $ref: "#/components/schemas/UpdateHello" }
        - { $ref: "#/components/schemas/UpdateState" }
        - { $ref: "#/components/schemas/UpdateDevice" }
        - { $ref: "#/components/schemas/UpdateDeviceRemoved" }
        - { $ref: "#/components/schemas/UpdateTimeline" }
        - { $ref: "#/components/schemas/UpdatePong" }
      discriminator:
        propertyName: type
        mapping:
          hello: "#/components/schemas/UpdateHello"
          state: "#/components/schemas/UpdateState"
          device: "#/components/schemas/UpdateDevice"
          device_removed: "#/components/schemas/UpdateDeviceRemoved"
          timeline: "#/components/schemas/UpdateTimeline"
          pong: "#/components/schemas/UpdatePong"

    UpdateHello:
      type: object
      required: [type, server_time, heartbeat_sec, devices]
      properties:
        type: { type: string, const: hello }
        server_time: { type: number }
        heartbeat_sec: { type: number, description: The protocol ping interval. }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceDetail" }

    UpdateState:
      type: object
      required: [type, device_id, ts, entities]
      properties:
        type: { type: string, const: state }
        device_id: { type: integer }
        ts: { type: number }
        entities:
          type: array
          description: Only the entities whose value changed.
          items: { $ref: "#/components/schemas/EntityChange" }

    UpdateDevice:
      type: object
      required: [type, device]
      properties:
        type: { type: string, const: device }
        device: { $ref: "#/components/schemas/DeviceSummary" }

    UpdateDeviceRemoved:
      type: object
      required: [type, device_id]
      properties:
        type: { type: string, const: device_removed }
        device_id: { type: integer }

    UpdateTimeline:
      type: object
      required: [type, item, replaces]
      properties:
        type: { type: string, const: timeline }
        item: { $ref: "#/components/schemas/TimelineItem" }
        replaces:
          type: array
          description: Ids of cards sent earlier that this one now stands for; drop them.
          items: { type: integer }

    UpdatePong:
      type: object
      required: [type]
      properties:
        type: { type: string, const: pong }
