# The JDK the Gradle daemon runs on: 25. Robolectric's sandboxes for SDK 36 and 37 (the target)
# need Java 21 or later; the app itself is still compiled to Java 17 bytecode (build-logic).
# Gradle picks a matching JDK it can find (JAVA_HOME, the usual install locations, or
# org.gradle.java.installations.paths) and stops with a clear message if there is none.
toolchainVersion=25
