org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle retries a failed download itself (3 tries by default); repositories that answer 429 or 5xx
# for a minute need a few more, further apart. CI also re-runs a build that died downloading
# (scripts/gradle-ci.sh).
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
