# On top of detekt's defaults. The mock is one process holding a fake world in memory; its route
# table and seed data are long by nature.
# detekt 2 compares these limits with ">" where 1.x used ">=", so each is the 1.x threshold minus one.
complexity:
  LongMethod:
    allowedLines: 119
  CyclomaticComplexMethod:
    allowedComplexity: 29
  LargeClass:
    allowedLines: 899
  TooManyFunctions:
    allowedFunctionsPerFile: 39
    allowedFunctionsPerClass: 39
  LongParameterList:
    allowedFunctionParameters: 9
    allowedConstructorParameters: 19
style:
  MagicNumber:
    active: false
  # Validators mirror petkit-local's early-return checks (`ha/schedules.py`), one refusal per rule.
  ReturnCount:
    max: 12
  MaxLineLength:
    maxLineLength: 140
  # Request validators refuse each bad field with its own API error, as petkit-local's do.
  ThrowsCount:
    max: 12
exceptions:
  # Request parsing turns a library's parse failure into the API's own error code on purpose
  # (`bad_parameter`, `invalid_feed`): the original exception is the detail, the code is the answer.
  SwallowedException:
    active: false
